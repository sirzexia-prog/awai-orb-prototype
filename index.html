<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>あわい · 入口</title>
  <link rel="stylesheet" href="gate.css">
  <script src="gate.js" defer></script>
</head>
<body>
  <main class="gate-card">
    <div class="orb" aria-hidden="true"><span>· ·</span></div>
    <p class="eyebrow">小さなデジタル相棒</p>
    <h1>あわい</h1>
    <p class="intro">ちょっと話して、いっしょに育つ。</p>
    <form id="gate-form">
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required disabled>
      <button id="enter" type="submit" disabled>相棒に会う</button>
    </form>
    <p id="status" class="status" role="status" aria-live="polite">入口を準備しています…</p>
    <p class="notice">簡易の入口です。公開された画像やコードへの直接アクセスは防げません。</p>
    <p class="version">試作 v0.3.18 · 会話はデモです</p>
    <noscript>この試作にはJavaScriptが必要です。</noscript>
  </main>
</body>
</html>
