<body data-capture="1"><main class="rt-shell capture-shell">
<header class="rt-header"><a id="rt-back" hidden aria-hidden="true"></a><div><strong>光の水庭</strong><span>仮人間テスト · v0.3.17 / 雷v3</span></div><div class="header-actions"><button id="rt-pause" aria-label="一時停止">Ⅱ</button><button id="rt-menu" aria-label="演出と設定">•••</button></div></header>

<div class="boss-hud"><div><span>水庭の大牙</span><small id="rt-boss-hp"></small></div><progress id="rt-boss-bar" aria-label="大牙の体力"></progress><span id="rt-signal" role="status"></span><span id="rt-hit-note" aria-live="off"></span></div>

<div class="rt-bottom"><div class="hero-hud"><div><strong id="rt-name">テスト役</strong><small id="rt-hp"></small></div><progress id="rt-hp-bar" aria-label="テスト役の体力"></progress><span id="rt-state"></span></div><div class="energy-line"><span>必殺技ゲージ</span><progress id="rt-energy" max="100" aria-label="必殺技ゲージ"></progress><span id="rt-energy-label"></span><small>仮の人間キャラクター</small></div><nav id="rt-controls" aria-label="攻撃方針を選ぶ"><button data-rt-policy="melee" aria-pressed="true"><span>⚔</span><strong>近接でいこう</strong><small>近づいて戦う</small></button><button data-rt-policy="magic" aria-pressed="false"><span>✦</span><strong>魔法でいこう</strong><small>離れて魔法で戦う</small></button></nav><p id="rt-vfx-label" class="vfx-note">攻撃演出プレビュー · 空間斬り</p><p class="auto-note">移動・攻撃・防御・回避・技は自動。</p></div>
<dialog id="rt-details"><div class="detail-head"><strong>仮表示の一戦</strong><button id="rt-close">閉じる</button></div><p>開発経過を撮るための専用表示です。画面には普通の仮人間だけを使います。背景・敵・自動戦闘は本編と同じです。</p><fieldset class="vfx-settings"><legend>攻撃演出プレビュー</legend><div><button data-rt-vfx="sword" aria-pressed="true">空間斬り</button><button data-rt-vfx="machinegun" aria-pressed="false">マシンガン</button><button data-rt-vfx="thunder" aria-pressed="false">雷</button></div><small>見える武器と演出だけを切り替えます。装備の取得や能力変更はありません。</small></fieldset><label><input id="rt-reduced" type="checkbox">動きを少なくする</label><p id="rt-motion-note"></p><p id="rt-source-note">育成保存と通常の戦闘保存は変更しません。仮表示の一戦だけを別に保存し、経験・報酬は増えません。</p><button id="rt-reset">仮表示の戦闘をやり直す</button></dialog>
</main></body></html>
