<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>あわい · 水庭の戦闘試作</title><link rel="stylesheet" href="battle-scene.css"><script src="engine.js" defer></script><script src="combat.js" defer></script><script src="warrior-material.js" defer></script><script src="creature.js" defer></script><script src="scene-combat.js" defer></script><script src="scene-world.js" defer></script><script src="battle-scene.js" defer></script></head>
<body><main class="battle-shell">
<header class="scene-header"><a href="index.html" aria-label="育成へ戻る">‹</a><div><strong>光の水庭</strong><span>戦闘改修の試作</span></div><button id="scene-menu" aria-label="戦闘の記録と設定">•••</button></header>
<section id="scene-stage" class="scene-stage" aria-label="水庭で巻き岩と向き合う戦場"><canvas id="scene-canvas" width="960" height="1440" role="img" aria-label="相棒と巻き岩の戦闘"></canvas>
<div class="scene-hud"><div class="unit-status"><span id="scene-player-name">相棒</span><strong id="scene-player-hp"></strong><progress id="scene-player-bar" aria-label="相棒の体力"></progress><div class="breath-row"><span>息</span><div id="scene-breath" aria-label="相棒の息"></div></div></div><div class="unit-status enemy-status"><span>巻き岩</span><strong id="scene-enemy-hp"></strong><progress id="scene-enemy-bar" aria-label="巻き岩の体力"></progress><span id="scene-intent" class="intent"></span></div></div>
<p id="scene-message" class="scene-message" role="status">次の一手を、きみが選ぶ。</p><div id="scene-result" class="scene-result" hidden><span id="scene-outcome"></span><button id="scene-retry">もう一戦</button></div></section>
<nav id="scene-controls" class="scene-controls" aria-label="相棒への指示"><button data-scene-action="strike"><span class="skill-icon">╱</span><strong>打撃</strong><small>息 −1</small></button><button data-scene-action="magic"><span class="skill-icon">✦</span><strong>魔法</strong><small>息を放つ</small></button><button data-scene-action="guard"><span class="skill-icon">◈</span><strong>守る</strong><small>息 +2・返し</small></button><button data-scene-action="focus"><span class="skill-icon">◌</span><strong>蓄える</strong><small>息 +3</small></button></nav>
<dialog id="scene-details"><div class="detail-head"><strong>この一戦</strong><button id="scene-details-close">閉じる</button></div><p>打撃で殻にひび。魔法は残っている息を放ち、息3以上なら深く崩します。殻を崩すと大技を止め、次の2手が好機になります。</p><p>防御は衝撃を減らし、息と次の打撃への返しを取ります。蓄えると息が多く戻りますが、攻撃はそのまま受けます。</p><ol id="scene-history"></ol><label class="motion-setting"><input type="checkbox" id="scene-reduced-motion">動きを少なくする</label><p id="scene-motion-note" class="preview-note"></p><p class="preview-note">この試作の戦闘だけを端末に保存します。元の相棒、部位、思い出、進行は変更しません。育成中の相棒と装備を使い、勝利の報酬はまだありません。</p><button id="scene-reset">この戦闘をやり直す</button></dialog>
</main></body></html>
