<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'"><title>攻撃側の共通支点 · r6</title><link rel="stylesheet" href="attack-rig-r6.css"><script src="attack-rig-r6.js" defer></script></head><body><main><a href="motion-intake.html">素材受入へ戻る</a><h1>攻撃側の分割・共通支点</h1><p id="rig-status" role="status">読み込み中</p><p>3角度の準備素材です。剣1振り・7キー姿勢・命中は未確定です。握りを同じ原点へ登録し、各部品を共通キャンバスで変換しました。</p><nav id="angles" aria-label="原画の角度"><button data-angle="1">角度1</button><button data-angle="2">角度2</button><button data-angle="3">角度3</button></nav><div class="compare"><figure><figcaption>分割再合成 · 同じ柄の原点</figcaption><canvas id="rig-canvas" width="640" height="420"></canvas></figure><figure><figcaption>受領した組立見本 · 同じ格子</figcaption><canvas id="reference-canvas" width="640" height="420"></canvas></figure></div><fieldset><legend>分割レイヤー</legend><label><input type="checkbox" data-layer="arm-shoulder-cloth-visible" checked>肩・腕・付随布（可視面）</label><label><input type="checkbox" data-layer="hand-hilt" checked>手・柄</label><label><input type="checkbox" data-layer="blade-visible" checked>刃（可視面）</label><label><input type="checkbox" id="show-anchors">仮支点を表示</label></fieldset><p id="rig-metrics"></p><p>仮支点は見える原画からの登録値です。肩・肘・核中心の最終支点は、修正7キーと制作側の座標を待って確定します。露出する隠れ面の作画はしていません。</p><p>支持側RGBの市松は焼き込みのため、完成RGBAとして登録していません。素材読込み失敗時はエラーを示し、旧v6へ置換しません。</p><a href="index.html?view=custom">カスタムへ戻る</a></main></body></html>
